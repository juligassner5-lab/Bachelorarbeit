<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Exercise — Progress Visualization</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%234f46e5'/></svg>">
<style>
  /* Design tokens. Every color, size and radius used below is defined here. */
  :root {
    --text:        #1e1b2e;
    --text-2:      #4b4560;
    --text-muted:  #8b8698;
    --card:        #ffffff;
    --surface:     #faf9ff;
    --surface-2:   #f7f7fb;
    /* Summary tile background (aspect 5), same blue as the page gradient. */
    --surface-accent: #eef0ff;
    --border:      #eceafc;
    --stroke:      #b4aecb;
    --light-off:   #e4e1ee;
    --accent:      #4f46e5;
    --ok:          #22c55e;
    --warning:     #eab308;
    --critical:    #ef4444;
    /* Data-type colours (aspect 3 legend and bar segments). */
    --data-communication: var(--accent);
    --data-tasks:         #f59e0b;
    --data-infrastructure: var(--critical);
    --radius-card: 20px;
    --radius-ui:   14px;
    --radius-btn:  10px;
    /* Height of the bounded zoom window (see .viewport). */
    --viewport-h:  min(72vh, 760px);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 20px 60px;
    font-family: "Inter", -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 15% 0%, #eef0ff, #f7f7fb 45%);
    background-attachment: fixed;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  header.page { padding: 26px 2px 8px; }
  .kicker {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--accent);
  }
  h1 { font-size: 22px; font-weight: 800; margin: 6px 0 0; }
  .subline { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* --- Time control (sticky) --- */
  .controlbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; margin: 14px 0 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-ui);
    backdrop-filter: blur(6px);
  }
  .controlbar button {
    font: inherit; font-weight: 600; font-size: 13px;
    padding: 8px 16px; min-width: 92px;
    color: var(--card); background: var(--accent);
    border: none; border-radius: var(--radius-btn); cursor: pointer;
  }
  .controlbar button:hover { filter: brightness(1.08); }
  .controlbar input[type=range] { flex: 1; accent-color: var(--accent); }
  .clock {
    font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600;
    min-width: 150px; text-align: right; color: var(--text-2);
  }

  /* --- Cards --- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    box-shadow: 0 20px 45px -24px rgba(79,70,229,.28);
    padding: 22px 18px;
    margin: 20px 0;
  }
  .card h2 {
    font-size: 18px; font-weight: 800; margin: 0;
    text-transform: none; letter-spacing: .01em;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; margin: 0 0 14px;
  }

  /* --- Zoom window (aspects 1, 3, 4) --- */
  .viewport {
    position: relative;
    height: var(--viewport-h);
    overflow: hidden;
    cursor: grab;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-ui);
  }
  .viewport:active { cursor: grabbing; }
  .viewport > svg { display: block; }

  /* Aspect 3 gets its own, smaller window height than the shared --viewport-h. */
  #a3-viewport { height: 460px; }

  /* Capped scroll area for aspect 2's grid and aspect 4's empty-exercise note. */
  .viewport.is-capped {
    height: auto; max-height: var(--viewport-h);
    overflow-y: auto; cursor: auto;
    background: none; border: none; border-radius: 0;
  }

  .vp-controls { display: flex; gap: 6px; flex: none; }
  .vp-controls button {
    font: inherit; font-size: 11px; font-weight: 600;
    padding: 5px 11px; cursor: pointer;
    color: var(--text-2); background: var(--card);
    border: 1px solid var(--border); border-radius: 999px;
  }
  .vp-controls button:hover { border-color: var(--stroke); }

  /* --- Aspect 2: container grid (column count decided by the browser) --- */
  #a2-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
  }
  /* Fixed card height: head, one active line, four-block history below. */
  .stack {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-ui);
    padding: 10px;
    display: flex; flex-direction: column; gap: 8px;
    height: 182px;
    overflow: hidden;
  }
  .stack-head {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 700;
    padding-right: 22px; /* room for .stack-count, top right */
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  /* Total count of finished tasks, positioned next to the role name. */
  .stack-count {
    position: absolute; top: 8px; right: 8px;
    font-size: 10px; font-weight: 700;
    color: var(--text-2); background: var(--surface-2);
    border-radius: 999px; padding: 2px 6px;
    font-variant-numeric: tabular-nums;
  }
  .slot-active {
    border: 1px dashed var(--stroke); border-radius: 8px;
    padding: 5px 7px; font-size: 10.5px; min-height: 28px;
    display: flex; align-items: center; color: var(--text-2);
    background: var(--card);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .slot-active.empty { color: var(--text-muted); font-style: italic; }
  /* Capped at four finished blocks (4 x 22px + 3 x 3px gap); rest scrolls. */
  .stack-done {
    display: flex; flex-direction: column-reverse; gap: 3px;
    max-height: 97px; overflow-y: auto;
  }
  .task-block {
    flex-shrink: 0;
    font-size: 10px; padding: 4px 7px; border-radius: 6px;
    color: var(--card); opacity: .92;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* --- Aspect 3: granularity switch --- */
  #a3-top {
    display: flex; justify-content: space-between; align-items: center;
    gap: 20px; margin-bottom: 10px;
  }
  .granularity { display: flex; gap: 6px; flex-wrap: wrap; }
  .granularity button {
    font: inherit; font-size: 11px; font-weight: 600;
    padding: 5px 12px; cursor: pointer;
    color: var(--text-2); background: var(--card);
    border: 1px solid var(--border); border-radius: 999px;
  }
  .granularity button[aria-pressed="true"] {
    color: var(--card); background: var(--accent); border-color: var(--accent);
  }
  .legend {
    display: flex; gap: 16px; flex-wrap: wrap;
    font-size: 11px; color: var(--text-2);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* --- Aspect 5: tiles (count follows from the configuration) --- */
  #a5-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
    gap: 16px;
  }
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-ui); padding: 14px 15px;
    border-left: 4px solid var(--accent);
    min-width: 165px;
  }
  /* Summary tiles: accent background and a larger amount, no border change. */
  .tile.summary { background: var(--surface-accent); }
  .tile.summary .value { font-size: 26px; }
  /* Note shown when an exercise has not configured this area at all */
  .empty-note { margin: 0; font-size: 11px; color: var(--text-muted); }
  .tile .label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--text-2);
  }
  .tile .value {
    font-size: 22px; font-weight: 800; margin-top: 10px;
    font-variant-numeric: tabular-nums;
  }
  .tile .badge {
    font-size: 12px; color: var(--text-2); margin-top: 4px;
    font-weight: 600;
  }
  .tile .sub {
    font-size: 15px; color: var(--text-2); margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  /* Empty badge/sub lines take up no space. */
  .tile .badge:empty, .tile .sub:empty { display: none; }

  /* --- Tooltip --- */
  #tooltip {
    position: fixed; z-index: 60; pointer-events: none;
    display: none; max-width: 280px;
    padding: 7px 10px; border-radius: 8px;
    font-size: 11.5px; line-height: 1.45;
    color: #fff; background: rgba(30,27,46,.94);
    box-shadow: 0 8px 22px -8px rgba(0,0,0,.5);
  }
  #tooltip b { font-weight: 700; }

  /* --- Load error --- */
  #error {
    display: none; margin: 20px 0; padding: 16px 18px;
    border: 1px solid #fecaca; border-left: 4px solid var(--critical);
    border-radius: var(--radius-ui); background: #fef2f2;
    font-size: 13px; line-height: 1.6; color: #7f1d1d;
  }
  #error code { font-size: 12px; }

  text { font-family: inherit; }
</style>
</head>
<body>
<div class="wrap">

  <header class="page">
    <div class="kicker">Cyber Exercise — Progress Visualization</div>
    <h1 id="exercise-name">…</h1>
  </header>

  <div id="error"></div>

  <!-- One clock drives all five aspects -->
  <div class="controlbar">
    <button id="play" type="button">Play</button>
    <input id="scrub" type="range" min="1" max="1" value="1" step="1" aria-label="Time position">
    <div class="clock" id="clock">—</div>
  </div>

  <section class="card">
    <div class="card-head">
      <h2>Communication</h2>
      <div class="vp-controls" id="a1-controls"></div>
    </div>
    <div class="viewport" id="a1-viewport"><svg id="a1" role="group" aria-label="Sequence diagram of the communication"></svg></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Task Stack</h2>
    </div>
    <div class="viewport is-capped" id="a2-viewport"><div id="a2-grid"></div></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Event Density</h2>
      <div class="vp-controls" id="a3-controls"></div>
    </div>
    <div id="a3-top">
      <div class="granularity" id="a3-granularity"></div>
      <div class="legend" id="a3-legend"></div>
    </div>
    <div class="viewport" id="a3-viewport"><svg id="a3" role="group" aria-label="Event density over exercise time"></svg></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Infrastructure State</h2>
      <div class="vp-controls" id="a4-controls"></div>
    </div>
    <div class="viewport" id="a4-viewport"><svg id="a4" role="group" aria-label="State of the infrastructure components"></svg></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Business Impact</h2>
    </div>
    <div id="a5-tiles"></div>
  </section>

</div>

<div id="tooltip"></div>

<script src="lib/d3.min.js"></script>
<script src="lib/dagre.min.js"></script>
<script src="core.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
